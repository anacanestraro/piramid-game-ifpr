name: piramidgameifpr
description: "PiramidGame IFPR-Pgua - ranking de popularidade do campus."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # --- Estado e navegação ---
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  go_router: ^17.3.0

  # --- Armazenamento local auxiliar (tema, cache de sessão) ---
  shared_preferences: ^2.5.5

  # --- Firebase ---
  firebase_core: ^4.14.0     # inicialização do Firebase
  firebase_auth: ^6.7.0      # autenticação (e-mail/senha e Google)
  cloud_firestore: ^6.10.0   # banco de dados remoto
  google_sign_in: ^7.2.0     # fluxo de login com conta Google

  # --- Visual ---
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true